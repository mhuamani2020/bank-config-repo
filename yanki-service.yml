server:
  port: 8085

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/yanki_db
      auto-index-creation: true
  # ========================================================================
  # Kafka (Parte III) — arquitectura orientada a eventos
  # ========================================================================
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: yanki-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Propiedades externalizadas del monedero Yanki
app:
  # Parte III: arquitectura orientada a eventos con Kafka como message broker.
  kafka:
    topics:
      wallet-operations: wallet-operations
      wallet-operation-results: wallet-operation-results
  jwt:
    # Clave simétrica compartida con auth-service para validar la firma del JWT
    # (este servicio actúa como OAuth2 Resource Server).
    secret: "bank-system-super-secret-key-for-jwt-hs256-2026-nttdata"

# Descubrimiento de servicios con Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
