server:
  port: 8082

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/bank_account_db
      auto-index-creation: true

# URLs que consumen CustomerClientAdapter y CreditClientAdapter
app:
  urls:
    customer-service: "http://localhost:8081/customers/"
    credit-service: "http://localhost:8083/credits/"

# Descubrimiento de servicios con Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# ==========================================================================
# Estándar de resiliencia (circuit breakers) — bank-resilience-commons
# Instancias: customerServiceCB (-> customer-service), creditServiceCB (-> credit-service)
# Regla obligatoria: minimumNumberOfCalls <= slidingWindowSize
# Estas anotaciones @CircuitBreaker/@TimeLimiter toman su configuración de aquí.
# ==========================================================================
resilience4j:
  circuitbreaker:
    instances:
      customerServiceCB:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      creditServiceCB:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      customerServiceCB:
        timeoutDuration: 2s
        cancelRunningFuture: true
      creditServiceCB:
        timeoutDuration: 2s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
