server:
  port: 8082

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/bank_account_db
      auto-index-creation: true

# URLs que consumen CustomerClientAdapter y CreditClientAdapter
app:
  urls:
    customer-service: "http://customer-service/customers/"
    credit-service: "http://credit-service/credits/"

# Descubrimiento de servicios con Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Tolerancia a fallos con Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      creditServiceCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      creditServiceCB:
        timeoutDuration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers